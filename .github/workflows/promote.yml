name: promote

# Promotion is a Git change. This workflow never talks to a cluster, never
# holds kubeconfig, and never runs kubectl. Argo CD reconciles after merge.
#
# CI must not rewrite overlays from images it just built into an ephemeral
# registry: those digests are unreachable from a workstation or from kind.
# Local promotion is `make promote ENV=dev` after `make push`.

"on":
  pull_request:
    paths:
      - "environments/**"
      - "scripts/promote.py"
      - "tests/unit/test_promote.py"
      - ".github/workflows/promote.yml"
      - ".github/workflows/*.yml"

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-gate:
    name: Production promotion gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out source with base history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Fetch the pull request base
        shell: bash
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - name: Require confirmation when production pins change
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >
          python scripts/promote.py gate
          --base "origin/${{ github.base_ref }}"
          --head HEAD
          --confirm-text "${PR_BODY}"
