name: verify

"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository:
    name: Repository contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned checks
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run repository contract
        run: make verify
      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  local-lifecycle:
    name: Local lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned kind
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/kind \
            https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl --fail --location --silent --show-error \
            --output /tmp/kind.sha256sum \
            https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64.sha256sum
          sed 's#kind-linux-amd64#/tmp/kind#' /tmp/kind.sha256sum | sha256sum --check
          sudo install --mode 0755 /tmp/kind /usr/local/bin/kind
      - name: Install pinned kubectl
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl \
            https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          curl --fail --location --silent --show-error \
            --output /tmp/kubectl.sha256 \
            https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install --mode 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Check prerequisites
        run: make doctor
      - name: Exercise idempotent lifecycle
        run: make verify-local
      - name: Cleanup project resources
        if: always()
        run: make down
