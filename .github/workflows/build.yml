name: build

"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so the scanner version is part of the reviewed change, not a
  # surprise that turns a green pipeline red on an unrelated morning.
  TRIVY_VERSION: "0.74.0"

jobs:
  images:
    name: Build, attest, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      # A real registry, rather than a local image load, so the push path,
      # the manifest digest, and the attestations are all genuinely exercised.
      registry:
        image: registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
        ports:
          - 5000:5000

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Configure a BuildKit builder that can attest and reach the registry
        shell: bash
        run: |
          # Attestations require the docker-container driver; host networking
          # lets that container reach the registry published on the runner.
          cat >/tmp/buildkitd.toml <<'TOML'
          [registry."localhost:5000"]
            http = true
          TOML
          docker buildx create \
            --name ci \
            --driver docker-container \
            --driver-opt network=host \
            --config /tmp/buildkitd.toml \
            --use
          docker buildx inspect --bootstrap

      - name: Wait for the registry to accept requests
        shell: bash
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:5000/v2/ >/dev/null; then
              echo "registry ready"
              exit 0
            fi
            sleep 1
          done
          echo "registry did not become ready" >&2
          exit 1

      - name: Build and push immutable artifacts with SBOM and provenance
        run: |
          python scripts/build.py \
            --registry localhost:5000 \
            --version "0.0.0-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::12}" \
            --push

      - name: Show the resolved digests
        run: cat artifacts/images.json

      - name: Verify each image carries SBOM and provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/references.txt
          import json, pathlib
          manifest = json.loads(pathlib.Path("artifacts/images.json").read_text())
          for image in manifest["images"]:
              print(image["pinned_reference"])
          PY
          while read -r reference; do
            echo "checking attestations for ${reference}"
            docker buildx imagetools inspect --raw "${reference}" >/tmp/index.json
            # BuildKit records attestations as manifest entries referring to the
            # image; their absence means the supply-chain claim is unsupported.
            if ! grep -q "vnd.docker.reference.type" /tmp/index.json; then
              echo "no attestation manifests found for ${reference}" >&2
              exit 1
            fi
          done </tmp/references.txt

      - name: Install pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          curl --fail --location --silent --show-error \
            --output trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error \
            --output trivy_checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy_checksums.txt \
            | sed "s#trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz#/tmp/trivy.tar.gz#" \
            | sha256sum --check
          tar --extract --gzip --file trivy.tar.gz trivy
          sudo install --mode 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Scan images and block fixable HIGH or CRITICAL findings
        env:
          TRIVY_INSECURE: "true"
        run: python scripts/scan.py

      - name: Publish build and vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-evidence
          path: |
            artifacts/images.json
            artifacts/vulnerability-report.json
          if-no-files-found: warn
          retention-days: 14
