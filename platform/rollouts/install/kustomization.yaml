apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Argo Rollouts is installed by make bootstrap into every environment cluster
# that runs a Rollout, and is not reconciled by Argo CD. The controller that
# would abort a bad canary must not be the thing a bad GitOps sync can delete
# mid-analysis. Same boundary as ADR 0005, recorded in ADR 0006.

namespace: argo-rollouts

resources:
  - namespace.yaml
  - github.com/argoproj/argo-rollouts/manifests/cluster-install?ref=v1.8.3

labels:
  - includeSelectors: false
    pairs:
      platform.gitops-reliability.io/owner: eks-gitops-reliability-platform
