apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-generator
  namespace: platform
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/component: test-equipment
    app.kubernetes.io/part-of: eks-gitops-reliability-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: load-generator
  namespace: platform
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/component: test-equipment
    app.kubernetes.io/part-of: eks-gitops-reliability-platform
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: load-generator
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: platform
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/component: test-equipment
    app.kubernetes.io/part-of: eks-gitops-reliability-platform
spec:
  # Exactly one replica. The offered rate is a property of the test, so a
  # second replica would silently double it and invalidate every comparison
  # that depends on a known load.
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: load-generator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
        app.kubernetes.io/component: test-equipment
        app.kubernetes.io/part-of: eks-gitops-reliability-platform
    spec:
      serviceAccountName: load-generator
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load-generator
          image: gitops-registry:5000/load-generator:0.0.0-bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: platform-environment
          env:
            - name: TARGET_BASE_URL
              value: http://frontend.platform.svc.cluster.local:8080
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
